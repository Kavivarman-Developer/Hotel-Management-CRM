version: '3.8'

services:
  # MongoDB Single-Node Replica Set for Transaction Support
  mongo:
    image: mongo:7.0
    container_name: grand_omr_mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: |
        mongosh --port 27017 --eval "
        try {
          rs.status().ok
        } catch (e) {
          rs.initiate({
            _id: 'rs0',
            members: [{ _id: 0, host: '127.0.0.1:27017' }]
          }).ok
        }"
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Backend Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: grand_omr_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/grand_omr_residency?replicaSet=rs0
      CLIENT_URL: http://localhost:5173,http://localhost:3000,https://grandomrresidency.ai.studio
      JWT_ACCESS_SECRET: grand_omr_residency_super_secure_access_secret_2026_key
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: grand_omr_residency_super_secure_refresh_secret_2026_key
      JWT_REFRESH_EXPIRES_IN: 7d
      QR_TOKEN_SECRET: grand_omr_qr_token_signing_secret_2026_omr_chennai
      PAYMENT_PROVIDER: DEVELOPMENT_ADAPTER
      PAYMENT_WEBHOOK_SECRET: dev_webhook_signing_secret_omr
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src
      - ./server/uploads:/app/uploads

volumes:
  mongo_data:
